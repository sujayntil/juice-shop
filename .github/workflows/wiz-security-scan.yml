
name: Wiz Security Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiz-scan:
    name: Wiz CLI v1 Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Wiz CLI v1
        run: |
          curl -fL \
            https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64 \
            -o wizcli
          chmod +x wizcli
          ./wizcli version

      - name: Authenticate with Wiz
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: |
          ./wizcli auth \
            --id "$WIZ_CLIENT_ID" \
            --secret "$WIZ_CLIENT_SECRET"

      - name: Scan Repository and Publish Results
        run: |
          ./wizcli scan dir .

