
name: Wiz Security Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiz-scan:
    name: Wiz CLI Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wiz CLI v1
        run: |
          curl -fL \
            https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64 \
            -o wizcli
          chmod +x wizcli
          ./wizcli version

      - name: Verify credentials are present
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: |
          test -n "$WIZ_CLIENT_ID" || {
            echo "WIZ_CLIENT_ID is missing"
            exit 1
          }

          test -n "$WIZ_CLIENT_SECRET" || {
            echo "WIZ_CLIENT_SECRET is missing"
            exit 1
          }

          echo "Both credentials are present."

      - name: Authenticate with Wiz
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: |
          ./wizcli auth \
            --id "$WIZ_CLIENT_ID" \
            --secret "$WIZ_CLIENT_SECRET"

      - name: Scan Infrastructure as Code
        run: |
          ./wizcli iac scan --path .
